name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse scripts and exercise isolated registry fixtures
        shell: powershell
        run: ./tests/Run-Tests.ps1
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse scripts and exercise isolated registry fixtures
        shell: pwsh
        run: ./tests/Run-Tests.ps1

